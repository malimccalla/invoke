[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoke-work"
version = "0.1.0"
description = "Reference tooling for the .work format: ingestion, fingerprinting, validation and matching."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=42"]
analyse = ["librosa>=0.10", "numpy>=1.24"]
models = ["torch>=2.2", "demucs>=4.0", "basic-pitch>=0.3", "openai-whisper>=20231117"]
dev = ["pytest>=8.0"]

[project.scripts]
work = "work.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["work"]

[tool.pytest.ini_options]
testpaths = ["tests"]
